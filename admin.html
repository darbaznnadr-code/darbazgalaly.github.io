<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La Pasta — Admin</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><style>
:root{--bg:#f3eee6;--card:#fffaf3;--ink:#201916;--muted:#776d64;--wine:#681c2b;--gold:#b88b45;--line:#e1d5c5;--green:#246b4a;--red:#a72d36}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif}.login{min-height:100vh;display:grid;place-items:center;padding:25px;background:radial-gradient(circle at 80% 10%,#e6c99a,transparent 30%),var(--bg)}.loginbox{width:min(430px,100%);background:var(--card);padding:42px;border:1px solid var(--line);box-shadow:0 30px 90px #4a2b1518}.brand{font:700 44px 'Playfair Display';color:var(--wine);margin:0}.sub{color:var(--muted);margin:7px 0 30px}.field{display:flex;flex-direction:column;gap:7px;margin:13px 0}.field label{font-size:10px;letter-spacing:.14em;text-transform:uppercase}.field input,.field select,.field textarea{padding:13px;border:1px solid var(--line);background:white;font:inherit}.btn{border:0;background:var(--wine);color:white;padding:14px 18px;cursor:pointer;font-weight:700;letter-spacing:.06em}.error{color:var(--red);font-size:13px;margin-top:12px}.app{display:none}.head{background:#1c1512;color:white;padding:22px 5vw;display:flex;align-items:center;justify-content:space-between;gap:20px}.head h1{font:700 32px 'Playfair Display';margin:0}.head small{display:block;color:#cdb895;font:600 9px 'DM Sans';letter-spacing:.2em}.head button{background:transparent;border:1px solid #6d5a4d;color:white;padding:10px 15px}.wrap{width:min(1400px,90%);margin:35px auto}.welcome{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}.welcome h2{font:600 39px 'Playfair Display';margin:0}.welcome p{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.metric{background:var(--card);border:1px solid var(--line);padding:20px}.metric .num{font:700 29px 'Playfair Display';color:var(--wine)}.metric span{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}.toolbar{background:var(--card);border:1px solid var(--line);padding:15px;margin:20px 0;display:grid;grid-template-columns:1.5fr 1fr 1fr auto;gap:10px}.toolbar input,.toolbar select{padding:12px;border:1px solid var(--line);background:white}.tablebox{background:var(--card);border:1px solid var(--line);overflow:auto}.table{width:100%;border-collapse:collapse;min-width:1050px}.table th,.table td{padding:15px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.table th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.pill{display:inline-block;padding:5px 9px;font-size:10px;text-transform:uppercase;letter-spacing:.08em}.new{background:#f2e3bf;color:#6d4b13}.confirmed{background:#dceee4;color:var(--green)}.cancelled{background:#f5dddd;color:var(--red)}.actions{display:flex;gap:6px}.actions button{padding:7px 9px;border:1px solid var(--line);background:white;cursor:pointer;font-size:11px}.actions .ok{background:#e0f0e6;color:var(--green)}.actions .no{background:#fae1e2;color:var(--red)}.empty{text-align:center;padding:50px;color:var(--muted)}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modalbox{width:min(620px,100%);background:var(--card);padding:28px}.modalhead{display:flex;justify-content:space-between}.modalhead h3{font:600 29px 'Playfair Display';margin:0}.close{border:0;background:transparent;font-size:25px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.save{margin-top:15px;width:100%}@media(max-width:1050px){.cards{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.head{align-items:flex-start}.cards{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr}.welcome{display:block}.grid2{grid-template-columns:1fr}.wrap{width:94%}}
</style></head><body>
<div class="login" id="login"><div class="loginbox"><h1 class="brand">La Pasta</h1><p class="sub">Private restaurant administration</p><form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Password</label><input id="password" type="password" required></div><button class="btn" style="width:100%">Sign in to Dashboard</button><div class="error" id="loginError"></div></form></div></div>
<div class="app" id="app"><header class="head"><div><h1>La Pasta <small>ADMINISTRATION</small></h1></div><button id="logout">Sign out</button></header><main class="wrap"><div class="welcome"><div><h2>Good evening.</h2><p>Manage reservations, guests and recorded revenue from one place.</p></div><button class="btn" id="refresh">↻ Refresh</button></div><section class="cards"><div class="metric"><div class="num" id="mTotal">0</div><span>Total bookings</span></div><div class="metric"><div class="num" id="mToday">0</div><span>Today</span></div><div class="metric"><div class="num" id="mPending">0</div><span>Pending</span></div><div class="metric"><div class="num" id="mConfirmed">0</div><span>Confirmed</span></div><div class="metric"><div class="num" id="mGuests">0</div><span>Guests</span></div><div class="metric"><div class="num" id="mRevenue">$0</div><span>Recorded revenue</span></div></section><div class="toolbar"><input id="search" placeholder="Search name or phone…"><input id="dateFilter" type="date"><select id="statusFilter"><option value="all">All statuses</option><option value="new">New</option><option value="confirmed">Confirmed</option><option value="cancelled">Cancelled</option></select><button class="btn" id="clear">Clear</button></div><div class="tablebox"><table class="table"><thead><tr><th>Guest</th><th>Date</th><th>Time</th><th>Guests</th><th>Occasion</th><th>Status</th><th>Revenue</th><th>Actions</th></tr></thead><tbody id="tbody"></tbody></table></div></main></div>
<div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><h3>Edit reservation</h3><button class="close" id="close">×</button></div><div class="grid2"><div class="field"><label>Name</label><input id="eName"></div><div class="field"><label>Phone</label><input id="ePhone"></div><div class="field"><label>Date</label><input id="eDate" type="date"></div><div class="field"><label>Time</label><input id="eTime" type="time"></div><div class="field"><label>Guests</label><input id="eGuests"></div><div class="field"><label>Status</label><select id="eStatus"><option>new</option><option>confirmed</option><option>cancelled</option></select></div><div class="field"><label>Revenue</label><input id="eAmount" type="number" step="0.01" min="0"></div><div class="field"><label>Occasion</label><input id="eOccasion"></div><div class="field" style="grid-column:1/-1"><label>Notes</label><textarea id="eNotes"></textarea></div></div><button class="btn save" id="save">Save changes</button></div></div>
<script>
const URL='https://rtnfoklcgupugdyumwpp.supabase.co',KEY='sb_publishable_KjtCQyZ7VKPc0f3g7fq6HQ_DPxGHM9A';let token=sessionStorage.getItem('lp_admin_token')||'',rows=[],editing=null;const $=id=>document.getElementById(id);function authHeaders(extra={}){return Object.assign({apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json'},extra)}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').textContent='Signing in…';try{const r=await fetch(URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});const d=await r.json();if(!r.ok)throw Error(d.error_description||d.msg||'Login failed');token=d.access_token;sessionStorage.setItem('lp_admin_token',token);showApp();await load()}catch(x){$('loginError').textContent=x.message}};function showApp(){$('login').style.display='none';$('app').style.display='block'}if(token)showApp();$('logout').onclick=()=>{sessionStorage.removeItem('lp_admin_token');token='';location.reload()};
async function load(){try{const r=await fetch(URL+'/rest/v1/reservations?select=*&order=created_at.desc',{headers:authHeaders()});if(r.status===401){sessionStorage.removeItem('lp_admin_token');location.reload();return}if(!r.ok)throw Error(await r.text());rows=await r.json();updateMetrics();render()}catch(e){$('tbody').innerHTML='<tr><td colspan="8" class="empty">Could not load reservations.</td></tr>';console.error(e)}}
function updateMetrics(){const today=new Date().toISOString().slice(0,10);$('mTotal').textContent=rows.length;$('mToday').textContent=rows.filter(x=>x.date===today).length;$('mPending').textContent=rows.filter(x=>(x.status||'new')==='new').length;$('mConfirmed').textContent=rows.filter(x=>x.status==='confirmed').length;$('mGuests').textContent=rows.reduce((s,x)=>s+(parseInt(x.guests)||0),0);$('mRevenue').textContent='$'+rows.reduce((s,x)=>s+(parseFloat(x.amount)||0),0).toFixed(2)}
function filtered(){const q=$('search').value.toLowerCase(),df=$('dateFilter').value,s=$('statusFilter').value;return rows.filter(x=>(!q||(x.name||'').toLowerCase().includes(q)||(x.phone||'').toLowerCase().includes(q))&&(!df||x.date===df)&& (s==='all'||(x.status||'new')===s))}
function render(){const arr=filtered();$('tbody').innerHTML=arr.length?arr.map(x=>`<tr><td><strong>${esc(x.name||'—')}</strong><br><small>${esc(x.phone||'')}</small></td><td>${esc(x.date||'—')}</td><td>${esc(x.time||'—')}</td><td>${esc(x.guests||'—')}</td><td>${esc(x.occasion||'—')}</td><td><span class="pill ${x.status||'new'}">${x.status||'new'}</span></td><td>$${Number(x.amount||0).toFixed(2)}</td><td><div class="actions"><button class="ok" onclick="setStatus('${x.id}','confirmed')">Confirm</button><button class="no" onclick="setStatus('${x.id}','cancelled')">Cancel</button><button onclick="edit('${x.id}')">Edit</button><button onclick="removeRow('${x.id}')">Delete</button></div></td></tr>`).join(''):'<tr><td colspan="8" class="empty">No reservations found.</td></tr>'}function esc(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function setStatus(id,status){const r=await fetch(URL+'/rest/v1/reservations?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:authHeaders({'Prefer':'return=minimal'}),body:JSON.stringify({status})});if(!r.ok)alert('Could not update reservation');else load()}async function removeRow(id){if(!confirm('Delete this reservation?'))return;const r=await fetch(URL+'/rest/v1/reservations?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:authHeaders()});if(!r.ok)alert('Could not delete reservation');else load()}
function edit(id){editing=rows.find(x=>x.id===id);if(!editing)return;$('eName').value=editing.name||'';$('ePhone').value=editing.phone||'';$('eDate').value=editing.date||'';$('eTime').value=editing.time||'';$('eGuests').value=editing.guests||'';$('eStatus').value=editing.status||'new';$('eAmount').value=editing.amount||0;$('eOccasion').value=editing.occasion||'';$('eNotes').value=editing.notes||'';$('modal').style.display='flex'}$('close').onclick=()=>{$('modal').style.display='none'};$('save').onclick=async()=>{if(!editing)return;const body={name:$('eName').value,phone:$('ePhone').value,date:$('eDate').value,time:$('eTime').value,guests:$('eGuests').value,status:$('eStatus').value,amount:Number($('eAmount').value)||0,occasion:$('eOccasion').value,notes:$('eNotes').value};const r=await fetch(URL+'/rest/v1/reservations?id=eq.'+encodeURIComponent(editing.id),{method:'PATCH',headers:authHeaders({'Prefer':'return=minimal'}),body:JSON.stringify(body)});if(!r.ok){alert(await r.text());return}$('modal').style.display='none';await load()};$('refresh').onclick=load;['search','dateFilter','statusFilter'].forEach(id=>$(id).addEventListener('input',render));$('clear').onclick=()=>{$('search').value='';$('dateFilter').value='';$('statusFilter').value='all';render()};if(token)load();
</script></body></html>
